<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio - RianPow</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0f0f1a;color:#fff;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:40px 20px}
h1{font-size:2.5rem;margin-bottom:10px;background:linear-gradient(90deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#888;margin-bottom:40px}
.card{background:#1a1a2e;border-radius:12px;padding:24px;margin-bottom:20px;border:1px solid #2a2a3e}
.card h2{margin-bottom:10px;color:#667eea}
.card p{color:#aaa;line-height:1.6}
.links{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.links a{background:#667eea;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:500;transition:transform .2s}
.links a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="container">
<h1>RianPow Portfolio</h1>
<p class="subtitle">Welcome to my portfolio website</p>
<div class="card">
<h2>About Me</h2>
<p>Hi! I'm Rian, a passionate developer who loves building interactive websites and exploring new technologies.</p>
</div>
<div class="card">
<h2>Projects</h2>
<p>Check out my GitHub for more projects!</p>
<div class="links">
<a href="https://github.com/rianpowder-droid" target="_blank">GitHub</a>
<a href="https://rianpowder-droid.github.io/RianPow-Daily/" target="_blank">RianPow Daily</a>
</div>
</div>
</div>
</body>
</html>
