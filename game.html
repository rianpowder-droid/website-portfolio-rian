<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2D Game - RianPow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
canvas{border:2px solid #667eea;border-radius:8px;background:#111}
.info{margin-top:10px;color:#888;font-size:14px}
.score{font-size:20px;margin-bottom:10px;color:#667eea}
</style>
</head>
<body>
<div class="score">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
<canvas id="game" width="600" height="400"></canvas>
<div class="info">Arrow keys / WASD to move | Space to shoot</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let score=0,lives=3,gameOver=false;
const player={x:300,y:350,w:40,h:30,speed:5};
const bullets=[];
const enemies=[];
const keys={};
let enemyTimer=0;

document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')shoot();});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function shoot(){if(gameOver)return;bullets.push({x:player.x+player.w/2-2,y:player.y,w:4,h:10,speed:7});}

function spawnEnemy(){enemies.push({x:Math.random()*(canvas.width-30),y:-30,w:30,h:30,speed:1+Math.random()*2});}

function update(){
if(gameOver)return;
if(keys['ArrowLeft']||keys['a'])player.x=Math.max(0,player.x-player.speed);
if(keys['ArrowRight']||keys['d'])player.x=Math.min(canvas.width-player.w,player.x+player.speed);
if(keys['ArrowUp']||keys['w'])player.y=Math.max(0,player.y-player.speed);
if(keys['ArrowDown']||keys['s'])player.y=Math.min(canvas.height-player.h,player.y+player.speed);

bullets.forEach((b,i)=>{b.y-=b.speed;if(b.y<0)bullets.splice(i,1);});
enemies.forEach((e,i)=>{
e.y+=e.speed;
if(e.y>canvas.height){enemies.splice(i,1);lives--;if(lives<=0)gameOver=true;}
});
// collision
bullets.forEach((b,bi)=>{
enemies.forEach((e,ei)=>{
if(b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){
bullets.splice(bi,1);enemies.splice(ei,1);score+=10;
document.getElementById('score').textContent=score;
}
});
});
enemyTimer++;
if(enemyTimer>60-enemies.length*2){spawnEnemy();enemyTimer=0;}
document.getElementById('lives').textContent=lives;
}

function draw(){
ctx.fillStyle='#111';ctx.fillRect(0,0,canvas.width,canvas.height);
// stars
ctx.fillStyle='#333';
for(let i=0;i<50;i++){ctx.fillRect((i*37)%canvas.width,(i*73)%canvas.height,1,1);}
// player
ctx.fillStyle='#667eea';ctx.fillRect(player.x,player.y,player.w,player.h);
ctx.fillStyle='#764ba2';ctx.fillRect(player.x+player.w/2-5,player.y-5,10,5);
// bullets
ctx.fillStyle='#ff6b6b';bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
// enemies
ctx.fillStyle='#ff4757';enemies.forEach(e=>{ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#ff6b81';ctx.fillRect(e.x+5,e.y+5,e.w-10,e.h-10);ctx.fillStyle='#ff4757';});
if(gameOver){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='40px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2);ctx.font='20px sans-serif';ctx.fillText('Score: '+score,canvas.width/2,canvas.height/2+40);ctx.fillText('Press R to restart',canvas.width/2,canvas.height/2+70);}
}

document.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){if(gameOver){score=0;lives=3;gameOver=false;enemies.length=0;bullets.length=0;player.x=300;player.y=350;document.getElementById('score').textContent=0;document.getElementById('lives').textContent=3;}}});

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>EOF
echo "done"
